name: atlassian-mcp-server

on:
  push:
    branches: [jira]
    paths:
      - 'Dockerfile-atlassian-mcp-server'
      - '.github/workflows/atlassian-mcp-server.yaml'
  workflow_dispatch:
    inputs:
      REF:
        description: 'atlassian/atlassian-mcp-server ref (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlassian-mcp-server
  PROJECT: atlassian-mcp-server

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出 atlassian-mcp-server 源码
        uses: actions/checkout@v4
        with:
          repository: atlassian/atlassian-mcp-server
          ref: ${{ github.event.inputs.REF || 'main' }}
          token: ${{ secrets.KPULL }}
          path: ${{ env.PROJECT }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成日期 tag
        run: echo "TAG=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.PROJECT }}
          file: ./Dockerfile-atlassian-mcp-server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
