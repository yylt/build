name: keystone-auth
permissions:
  contents: read

on:
  push:
    branches: [ keystone-auth ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag'
        required: false
        default: ''

env:
  Dockerfile: Dockerfile-keystone-auth
  REGISTRY_NAME: "${{ secrets.MY_HUB_NAME }}"
  REGISTRY_USER: "${{ secrets.MY_HUB_USER }}"
  REGISTRY_PASS: "${{ secrets.MY_HUB_PASSWORD }}"
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Getting image tag
      id: tag
      run: |
        echo "trigger by ${{ github.event_name }}"

        if ${{ github.event_name == 'workflow_dispatch' }} ; then
            if [ "${{ github.event.inputs.tag }}" != "" ] ; then
                echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            else
                echo "tag=v1.36.0" >> $GITHUB_ENV
            fi
        else
            echo "tag=v1.36.0" >> $GITHUB_ENV
        fi

    - name: Check out repo code
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY_NAME }}
        username: ${{ env.REGISTRY_USER }}
        password: ${{ env.REGISTRY_PASS }}

    - name: Docker Image(multiarch) Build And Push
      run: |
        docker buildx build --no-cache \
          --platform linux/arm64,linux/amd64 \
          --provenance false --sbom false \
          --output "type=image,push=true" \
          --tag ${{ env.REGISTRY_NAME }}/multiarch/keystone-auth:${{ env.tag }} \
          --file ${{ env.Dockerfile }} .
